[project]
name = "markdown-card-whiteboard"
version = "0.1.0"
description = "Read Markdown as cards on a zoomable whiteboard (Windows, read-only)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "hlq2q" }]
dependencies = [
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.2",
    "pygments>=2.18.0",
    "pyside6>=6.7.0",
    "typer>=0.12.0",
    "pydantic-settings>=2.4.0",
    "loguru>=0.7.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    # Pinned (T-047): the type checker and the test runner decide pass/fail, so a silent
    # version drift can turn a green tree red (or the other way round) without a code change.
    "mypy==2.4.0",
    "pyinstaller>=6.10.0",
    "pytest==9.1.1",
    "pytest-cov>=5.0.0",
    # Pinned: the formatter's output has changed between ruff releases, and README lists
    # `ruff format --check .` as a required check -- 31 files had drifted when this was a
    # `>=` range (T-038/T-042).
    "ruff==0.17.0",
]

[project.scripts]
mcwr = "mcwr.interfaces.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcwr"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running checks"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Fakes must match Protocol signatures exactly (parameter names are part of the call
# contract), so unused arguments are expected in tests.
"**/test_*.py" = ["ARG002", "ARG005"]
# spikes/ holds throwaway feasibility scripts (see the architecture skill §5): they are
# deleted once their question is answered, so they are not held to the production bar.
"spikes/**" = ["E501", "B023", "ARG001", "ARG002", "F841"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/mcwr"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Pygments 2.21 ships no `py.typed` marker, so strict mode would reject its imports as
# untyped. Only the missing stubs are ignored: `pygments_highlighter` pins the Any values at
# its own boundary (annotated returns, `str()` on token text), so our code stays checked.
module = ["pygments.*"]
ignore_missing_imports = true
