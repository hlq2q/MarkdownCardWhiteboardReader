[project]
name = "markdown-card-whiteboard"
version = "0.1.0"
description = "Read Markdown as cards on a zoomable whiteboard (Windows, read-only)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "hlq2q" }]
dependencies = [
    "markdown-it-py>=3.0.0",
    "mdit-py-plugins>=0.4.2",
    "pygments>=2.18.0",
    "pyside6>=6.7.0",
    "typer>=0.12.0",
    "pydantic-settings>=2.4.0",
    "loguru>=0.7.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
mcwr = "mcwr.interfaces.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcwr"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
addopts = "-q --strict-markers"
markers = ["slow: long-running checks"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]

[tool.ruff.lint.per-file-ignores]
# Fakes must match Protocol signatures exactly (parameter names are part of the call
# contract), so unused arguments are expected in tests.
"**/test_*.py" = ["ARG002", "ARG005"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/mcwr"]
warn_unreachable = true
